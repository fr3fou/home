name: Renovate

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run mode"
        type: boolean
        default: false
      logLevel:
        description: "Log level"
        type: choice
        default: info
        options:
          - info
          - debug
  push:
    branches: ["main"]
    paths:
      - renovate.json
      - .github/workflows/renovate.yaml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.167.0
        env:
          # Without this Renovate has nothing to process and exits "successfully"
          # ("No repositories found"), which is why no PRs were opened for months.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: optional
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
