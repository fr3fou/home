---
# `amp orb provider` claims jobs from Amp over outbound HTTPS and runs
# ampere-dispatch for each one. Stateless; Amp re-offers unfinished claims.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ampere-provider
  labels:
    app.kubernetes.io/name: ampere-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ampere-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ampere-provider
    spec:
      serviceAccountName: ampere-provider
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: ghcr.io/fr3fou/ampere:0.1.0@sha256:af9df579596f323ed630969fdb6de6f128af0d2be79a951c21ca59fbf8e68be5
          command: ["/usr/bin/tini", "--", "amp", "orb", "provider", "/usr/local/bin/ampere-dispatch"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /home/amp
            - name: AMP_ORB_PROVIDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ampere-provider
                  key: AMP_ORB_PROVIDER_TOKEN
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/amp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
