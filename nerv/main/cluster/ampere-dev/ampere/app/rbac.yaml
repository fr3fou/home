---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ampere-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ampere-provider
---
# Namespaced grants: both ClusterRoles only apply inside this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ampere-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ampere-controller
subjects:
  - kind: ServiceAccount
    name: ampere-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ampere-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ampere-provider
subjects:
  - kind: ServiceAccount
    name: ampere-provider
