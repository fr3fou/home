---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ampere-controller
  labels:
    app.kubernetes.io/name: ampere-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ampere-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ampere-controller
    spec:
      serviceAccountName: ampere-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/fr3fou/ampere:0.1.0@sha256:af9df579596f323ed630969fdb6de6f128af0d2be79a951c21ca59fbf8e68be5
          args:
            - controller
            - --storage-class=longhorn
            - --runtime-class=gvisor-orb
            - --orb-types=default=4/8Gi/30Gi,small=2/4Gi/20Gi
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
