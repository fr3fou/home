---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ampere
  namespace: flux-system
spec:
  targetNamespace: ampere-dev
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: *app
  path: ./nerv/main/cluster/ampere-dev/ampere/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: gvisor
