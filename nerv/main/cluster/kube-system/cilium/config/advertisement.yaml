apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisements
  labels:
    advertise: bgp
spec:
  advertisements:
    # Enable PodCIDR advertisement for debugging
    # - advertisementType: "PodCIDR"
    - advertisementType: "Service"
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: ["never-used-value"] }
    # Envoy Gateway also sets spec.externalIPs to the gateway address, and
    # Cilium then only programs the ExternalIP frontend. Announce externalIPs
    # for the Envoy gateway Services only.
    - advertisementType: "Service"
      service:
        addresses:
          - ExternalIP
      selector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
          gateway.envoyproxy.io/owning-gateway-namespace: networking-system
