---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-proxy
  namespace: flux-system
spec:
  targetNamespace: kube-system
  path: ./nerv/main/cluster/kube-system/kube-proxy/app
  # Removing this GitOps entry must not delete the active service proxy.
  # Any future proxy removal requires a separately validated network migration.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
