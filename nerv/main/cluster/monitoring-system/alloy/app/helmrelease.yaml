# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: alloy
spec:
    interval: 30m
    chart:
        spec:
            chart: k8s-monitoring
            version: 4.6.1
            sourceRef:
                kind: HelmRepository
                name: grafana
    install:
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        cleanupOnFail: true
        remediation:
            retries: 3
    values:
        cluster:
            name: nerv
        # Destinations (v4: map keyed by name)
        destinations:
            grafanacloud-prometheus:
                type: prometheus
                url: https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/push
                auth:
                    type: basic
                    username: "1735527"
                    password: ENC[AES256_GCM,data:FjRSiHWi9KSI7Cq10ZltDSw4HDNYhrapYgL65F12fcba902RmeT3th7ZxDed71zxrSTHsoItW/ngI7RAvsuiSev2885fOfS1JudJ6wYZOaxW1zydEE8G/mRPRub+NxftqQ3Q9ekY3e1MD4WhjINRInDfLD758e2/faMENg==,iv:XUnL53977r3I5Qw5vIsf7EnxYwLt7pAx88bynRaCM+A=,tag:l/LPT0sjNpoSBFSKmBOjVQ==,type:str]
            grafanacloud-loki:
                type: loki
                url: https://logs-prod-012.grafana.net/loki/api/v1/push
                auth:
                    type: basic
                    username: "967489"
                    password: ENC[AES256_GCM,data:f2lJc8LN4/kynSbhYn66RLebUOfFM86fG9HnhGeH4JpJ+4iLJ57+HQDO7T7ylrGD+DqwPCZiSpmbML5IRxmACYBme3ebAzW0hqVLqvWxj36HrQVaMDAZWwrySYIehAauLnlEBmkjuRWfVmFn6lM7yTesmXQd/Xcxku2igA==,iv:f3QlET6Pa8A3Y3CjKNJP00Ot/RDcxMuxzUrJJQFpAl0=,tag:GrFJs0r//N5xS7+AruO5tQ==,type:str]
            grafanacloud-tempo:
                type: otlp
                url: https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
                protocol: http
                auth:
                    type: basic
                    username: "1009709"
                    password: ENC[AES256_GCM,data:utUSG9jLls4lTz0uUxEpXJoI+jq78PzPJL89IWhYUbfUCjAdaOHupAU5dyTG5VPlQgGCADYx50zw4azEZ8iP0hY0TV1KeOMXAP/U7JeFY3DqmV5I+7tZO2cFf8dTbrrwsKdtED9AqaKTUdd/E4hI4e0wsLi82ewcoPWFsg==,iv:xMzSciKPOWbLYxrD3VOotkXy9Od+TgBhSXirdy9QxbY=,tag:HJbu1JkNJhAIYRclB5RVXg==,type:str]
                traces:
                    enabled: true
                metrics:
                    enabled: false
                logs:
                    enabled: false
        # Features
        clusterMetrics:
            enabled: true
            collector: alloy-metrics
            kube-state-metrics:
                # Single replica: discover via the Service rather than Endpoints
                discoveryType: service
                metricsTuning:
                    # Grafana Cloud free tier caps active series at 15k.
                    # Old ReplicaSets (revision history) were ~1.6k series; keep only
                    # kube_replicaset_owner, which workload mapping needs.
                    excludeMetrics:
                        - kube_replicaset_(created|metadata_generation|spec_replicas|status_.*)
                        - kube_secret_metadata_resource_version
            cadvisor:
                metricsTuning:
                    # New in chart v4 (~900 series); not used by our dashboards.
                    excludeMetrics:
                        - container_pressure_.*
        hostMetrics:
            enabled: true
            collector: alloy-metrics
            linuxHosts:
                enabled: true
                metricsTuning:
                    useIntegrationAllowList: true
                # Per-pod Cilium veths (lxc*) were ~1.7k node_network_* series.
                extraMetricProcessingRules: |-
                    rule {
                      source_labels = ["__name__", "device"]
                      regex         = "node_network_.+;lxc.*"
                      action        = "drop"
                    }
        clusterEvents:
            enabled: true
            collector: alloy-singleton
        podLogsViaLoki:
            enabled: true
            collector: alloy-logs
        # Scrape pods/services annotated with k8s.grafana.com/scrape
        annotationAutodiscovery:
            enabled: true
            collector: alloy-metrics
        # Workloads feeding the features above (v4 telemetryServices)
        telemetryServices:
            kube-state-metrics:
                deploy: true
            node-exporter:
                deploy: true
        # Alloy collectors (v4: map with presets)
        collectors:
            alloy-metrics:
                presets:
                    - clustered
                    - statefulset
            alloy-singleton:
                presets:
                    - singleton
            alloy-logs:
                presets:
                    - filesystem-log-reader
                    - daemonset
