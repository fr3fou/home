---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 2h
  url: https://charts.longhorn.io
---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.12.2
      sourceRef:
        kind: HelmRepository
        name: longhorn
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    # Longhorn cannot be downgraded once its manager has migrated; never
    # auto-rollback a failed upgrade.
    remediation:
      retries: 0
  values:
    # NFSv4.1 backup target (same directory the former CIFS target used)
    defaultBackupStore:
      backupTarget: nfs://192.168.1.72:/Kubernetes/longhorn
    defaultSettings:
      defaultReplicaCount: 3
      defaultDataLocality: best-effort
      # Use the Talos userVolume mount
      defaultDataPath: /var/mnt/data/longhorn
      # Reduce storage reservation to allow more volume expansion
      storageMinimalAvailablePercentage: 10
      # Upgrade volume engines automatically after a Longhorn upgrade
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 3
    networkPolicies:
      enabled: true
      restrictInternalTraffic: true
    ingress:
      enabled: false
