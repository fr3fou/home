---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-apps-longhorn
  namespace: longhorn-system
spec:
  # Applications never need to reach Longhorn pods directly (volumes attach
  # through the node), so deny all ingress from the apps namespace.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apps
