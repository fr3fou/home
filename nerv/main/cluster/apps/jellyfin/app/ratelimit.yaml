---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: jellyfin-login-ratelimit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jellyfin
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - path:
                type: RegularExpression
                value: "(?i)/users/authenticate(byname|withquickconnect).*"
          limit:
            requests: 10
            unit: Minute
