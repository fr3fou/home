default_config:

recorder:
  # Seed only: copied to /config on first install. The URL lives in /config/secrets.yaml.
  db_url: !secret database_url

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  allowlist_external_urls:
    - https://home.nerv.id
  auth_mfa_modules:
    - type: totp
# http: (reverse proxy settings) is configured in the UI since 2026.11:
# Settings > System > Network. YAML is ignored after the one-time migration.
