---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: apps
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: apps
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      home-assistant:
        pod:
          hostNetwork: true
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.2@sha256:0d289f21951f9ecf0bf8888089c6d43f379611c47fe84f13d3302e83daa3c8fa
            env:
              TZ: UTC
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.144.0@sha256:b9e8056bb74bd0c4f90284c7559eddeccd38400cfedc28e64c9d3ca50fef1f83
            env:
              TZ: UTC
              PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-code-server
                    key: password
            args:
              - --auth
              - password
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - "8080"
              - /config
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        initContainers:
          install-hacs:
            image:
              repository: busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
              - /bin/sh
              - -c
            args:
              - |
                HACS_VERSION="2.0.5"
                mkdir -p /config/custom_components/hacs
                rm -rf /config/custom_components/hacs
                wget -qO- "https://github.com/hacs/integration/releases/download/$${HACS_VERSION}/hacs.zip" | unzip -d /config/custom_components/hacs -
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          copy-config:
            image:
              repository: busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
              - /bin/sh
              - -c
            args:
              - |
                if [ ! -f /config/configuration.yaml ]; then
                  cp /configfiles/* /config/
                fi
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
      code-server:
        controller: home-assistant
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - home.nerv.id
        parentRefs:
          - name: internal
            namespace: networking-system
        rules:
          - backendRefs:
              - name: home-assistant-app
                port: 8123
      code-server:
        hostnames:
          - code-home.nerv.id
        parentRefs:
          - name: internal
            namespace: networking-system
        rules:
          - backendRefs:
              - name: home-assistant-code-server
                port: 8080

    persistence:
      config:
        enabled: true
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
      configfiles:
        enabled: true
        type: configMap
        name: home-assistant-config
        advancedMounts:
          home-assistant:
            copy-config:
              - path: /configfiles
