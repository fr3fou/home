---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: windmill-login-ratelimit
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: windmill
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /api/auth/login
              methods:
                - value: POST
          limit:
            requests: 10
            unit: Minute
