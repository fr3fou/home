---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: redis
      redis_setup_type: replication
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: luncher-box-backend
        - podSelector:
            matchLabels:
              app: redis
              redis_setup_type: replication
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-system
          podSelector:
            matchLabels:
              name: redis-operator
      ports:
        - port: 6379
          protocol: TCP
