---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: apps
  annotations:
    # This resource embeds a shell script using ${...} syntax. Flux applies
    # postBuild.substituteFrom to every Kustomization (see nerv/main/flux/apps.yaml),
    # which would blank out every ${var} it cannot resolve. Opt this resource out.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Sofia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:17
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: postgres-apps-rw.apps.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-apps-superuser
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-apps-superuser
                      key: password
                - name: BACKUP_DIR
                  value: /nas/postgres-backups
                - name: RETENTION_DAYS
                  value: "14"
              command:
                - bash
                - -c
                - |
                  set -euo pipefail

                  ts="$(date +%Y%m%d-%H%M%S)"
                  file="${BACKUP_DIR}/postgres-apps-${ts}.sql.gz"
                  tmp="${file}.tmp"

                  mkdir -p "${BACKUP_DIR}"

                  echo "Dumping all databases to ${file}"
                  # pipefail ensures a failed pg_dumpall aborts before the mv below,
                  # so a truncated dump is never promoted to a real backup filename.
                  pg_dumpall --clean --if-exists | gzip -c > "${tmp}"
                  mv "${tmp}" "${file}"
                  echo "Backup complete: $(du -h "${file}" | cut -f1)"

                  echo "Pruning backups older than ${RETENTION_DAYS} days"
                  find "${BACKUP_DIR}" -maxdepth 1 -name 'postgres-apps-*.sql.gz' \
                    -mtime "+$((RETENTION_DAYS - 1))" -delete

                  echo "Remaining backups:"
                  ls -lh "${BACKUP_DIR}"
              volumeMounts:
                - name: nas
                  mountPath: /nas
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: nas
              nfs:
                server: 192.168.1.72
                path: /var/nfs/shared/Kubernetes
            - name: tmp
              emptyDir: {}
