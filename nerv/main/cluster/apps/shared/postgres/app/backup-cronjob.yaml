---
# Nightly logical backup of the postgres-apps CNPG cluster.
# Dumps all databases + globals with pg_dumpall, gzips the result, and writes
# it to the NAS over NFS. No WAL archiving / PITR - point-in-time granularity
# is one dump per run, which is intentional for this cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: apps
spec:
  schedule: "0 3 * * *"
  timeZone: "${TIMEZONE}"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: ${USER_UID}
            runAsGroup: ${USER_UID}
            fsGroup: ${USER_UID}
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: dump
              # pg_dumpall refuses to run when the server is NEWER than the
              # client, so this must track the cluster's PG major (currently
              # 18.x - the Cluster does not pin imageName, so the operator
              # default decides). Floating :18 + Always keeps the client at or
              # ahead of the server across minor bumps; bump this tag whenever
              # the cluster moves to a new major.
              image: ghcr.io/cloudnative-pg/postgresql:18
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: PGHOST
                  value: postgres-apps-rw.apps.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-apps-superuser
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-apps-superuser
                      key: password
                - name: BACKUP_DIR
                  value: /nas/postgres-backups
                - name: RETENTION_DAYS
                  value: "14"
              command:
                - bash
                - -c
                - |
                  # NOTE: shell variables here are deliberately UNBRACED.
                  # Flux applies postBuild.substituteFrom to every Kustomization
                  # (see nerv/main/flux/apps.yaml) and blanks out any
                  # dollar-brace reference it cannot resolve. Braced shell vars
                  # get silently emptied; unbraced $var passes through untouched.
                  # The TIMEZONE / USER_UID refs above are braced on purpose -
                  # those are real substitutions from the cluster-config CM.
                  set -euo pipefail
                  mkdir -p "$BACKUP_DIR"
                  ts="$(date +%Y%m%d-%H%M%S)"
                  file="$BACKUP_DIR/postgres-apps-$ts.sql.gz"
                  echo "Dumping all databases to $file"
                  # pipefail means a failed pg_dumpall aborts before the mv, so a
                  # truncated dump is never promoted to a real backup filename.
                  pg_dumpall --clean --if-exists | gzip -c > "$file.tmp"
                  mv "$file.tmp" "$file"
                  echo "Backup complete: $(du -h "$file" | cut -f1)"
                  echo "Pruning backups older than $RETENTION_DAYS days"
                  find "$BACKUP_DIR" -maxdepth 1 -name 'postgres-apps-*.sql.gz' \
                    -mtime "+$((RETENTION_DAYS - 1))" -delete
                  # Failed runs leave a *.sql.gz.tmp behind; the prune above
                  # only matches *.sql.gz, so sweep those separately. -mtime +1
                  # keeps this clear of any in-flight run.
                  echo "Pruning stale .tmp files from failed runs"
                  find "$BACKUP_DIR" -maxdepth 1 -name 'postgres-apps-*.sql.gz.tmp' \
                    -mtime +1 -delete

                  echo "Remaining backups:"
                  ls -lh "$BACKUP_DIR"
              volumeMounts:
                - name: nas
                  mountPath: /nas
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: nas
              nfs:
                server: 192.168.1.72
                path: /var/nfs/shared/Kubernetes
            - name: tmp
              emptyDir: {}
