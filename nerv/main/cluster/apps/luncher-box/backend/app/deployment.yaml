---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luncher-box-backend
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: luncher-box-backend
  template:
    metadata:
      labels:
        app: luncher-box-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 5
      containers:
        - name: luncher-box-backend
          image: ghcr.io/deliriumproducts/luncher-box-backend:latest@sha256:5a0a7290756891e7215d8d65c6b1c0831bd9f51f3247b1119787cf5d06e61c46
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 600Mi
          ports:
            - containerPort: 8080
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: YARN_CACHE_FOLDER
              value: /tmp/yarn-cache
            - name: COOKIE_URL
              value: ".deliprods.com"
            - name: BACKEND_PORT
              value: "8080"
            - name: FRONTEND_URL
              value: "https://luncherbox.deliprods.com"
            - name: BACKEND_URL
              value: "https://luncherbox-api.deliprods.com"
            - name: SOCKET_URL
              value: "https://luncherbox-api.deliprods.com"
          envFrom:
            - secretRef:
                name: luncher-box-backend-secrets
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: luncher-box-backend
  namespace: apps
  labels:
    app: luncher-box-backend
spec:
  selector:
    app: luncher-box-backend
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
