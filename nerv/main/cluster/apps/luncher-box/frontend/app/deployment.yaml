---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luncher-box-frontend
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: luncher-box-frontend
  template:
    metadata:
      labels:
        app: luncher-box-frontend
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 5
      containers:
        - name: luncher-box-frontend
          image: ghcr.io/deliriumproducts/luncher-box-frontend:latest@sha256:5f2477cf591db24b2e9c33f1c0feb499e892a2ab1fb2eee159549924719a1ae6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 600Mi
          ports:
            - containerPort: 3000
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
          livenessProbe:
            tcpSocket:
              port: 3000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: FRONTEND_PORT
              value: "3000"
            - name: FRONTEND_URL
              value: "https://luncherbox.deliprods.com"
            - name: BACKEND_URL
              value: "https://luncherbox-api.deliprods.com"
            - name: SOCKET_URL
              value: "https://luncherbox-api.deliprods.com"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: luncher-box-frontend
  namespace: apps
  labels:
    app: luncher-box-frontend
spec:
  selector:
    app: luncher-box-frontend
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
