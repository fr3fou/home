---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-apps-lan-egress
  namespace: apps
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [adguard, netronome]
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
    - toCIDRSet:
        - cidr: 192.168.0.0/16
          except:
            - 192.168.5.10/31
            - 192.168.5.12/30
            - 192.168.5.16/30
            - 192.168.5.20/32
    - toEntities: [host, remote-node]
      toPorts:
        - ports:
            - {port: "50000", endPort: 50001, protocol: TCP}
            - {port: "10250", protocol: TCP}
            - {port: "2379", endPort: 2380, protocol: TCP}
            - {port: "4240", protocol: TCP}
            - {port: "4244", protocol: TCP}
            - {port: "22", protocol: TCP}
