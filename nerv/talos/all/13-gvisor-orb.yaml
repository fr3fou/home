# Second gVisor runtime for Amp orbs (ampere). Same runsc binary as `runsc`, but
# with allow-suid so `sudo` works inside the sandbox (Amp's orb image needs
# passwordless sudo; Amp's own Substrate runtime passes the same flag).
# Root inside the orb is gVisor's emulated root, not host root.
# cpu-num-from-quota makes nproc report the pod's CPU limit instead of the
# host's core count, so build tools don't start one worker per host core.
# Other gVisor pods keep using `runsc` without these. RuntimeClass: gvisor-orb.
# Talos writes machine.files only at boot: changes here need a node reboot.
machine:
  files:
    - path: /var/etc/runsc/orb.toml
      op: create
      permissions: 0o644
      content: |
        [runsc_config]
          allow-suid = "true"
          cpu-num-from-quota = "true"
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: runsc-orb
content: |
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runsc-orb]
    runtime_type = "io.containerd.runsc.v1"
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runsc-orb.options]
    TypeUrl = "io.containerd.runsc.v1.options"
    ConfigPath = "/var/etc/runsc/orb.toml"
